<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipper-Flash</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#0b0e13; color:#e6e6e6;
         margin:0; padding:2rem 1.5rem; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size:1.3rem; display:flex; align-items:center; gap:.5rem; }
  h1 span { color:#f5c518; }
  .muted { color:#8b93a1; font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
          gap:1.1rem; margin-top:1.25rem; }
  .card { background:#141922; border:1px solid #222a36; border-radius:12px;
          overflow:hidden; transition:border-color .15s; cursor:pointer; }
  .card:hover { border-color:#f5c518; }
  .poster { position:relative; aspect-ratio:9/16; background:#000;
            display:flex; align-items:center; justify-content:center; }
  .poster.wide { aspect-ratio:16/9; }
  .poster img { width:100%; height:100%; object-fit:cover; }
  .dur { position:absolute; bottom:.5rem; right:.5rem; background:rgba(0,0,0,.75);
         padding:.05rem .4rem; border-radius:6px; font-size:.72rem; }
  .badge { position:absolute; top:.5rem; left:.5rem; background:rgba(245,197,24,.9);
           color:#000; padding:.05rem .45rem; border-radius:6px; font-size:.68rem;
           font-weight:600; }
  .meta { padding:.6rem .7rem .8rem; }
  .clip-title { font-size:.85rem; line-height:1.25; margin:0 0 .3rem;
                display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                overflow:hidden; }
  .sub { font-size:.72rem; color:#8b93a1; }
  dialog { background:#141922; color:#e6e6e6; border:1px solid #222a36;
           border-radius:14px; max-width:min(92vw, 480px); padding:1rem; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog video { width:100%; border-radius:8px; background:#000; }
  .empty { text-align:center; padding:4rem 1rem; color:#8b93a1; }
  code { background:#1c232e; padding:.1rem .35rem; border-radius:5px; }
  details { margin-top:2rem; }
  summary { cursor:pointer; color:#8b93a1; font-size:.85rem; }
  .status-row { display:flex; gap:.5rem; align-items:center; padding:.35rem 0;
                border-bottom:1px solid #161c26; font-size:.8rem; }
  .pill { padding:.05rem .55rem; border-radius:99px; font-size:.7rem;
          background:#1c232e; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ <span>Clipper-Flash</span>
      <span class="muted" style="font-weight:400;font-size:.8rem">your clips</span></h1>

  <div id="gallery" class="grid"><p class="muted">loading…</p></div>

  <details>
    <summary>Pipeline status</summary>
    <div id="status"></div>
  </details>
</div>

<dialog id="player"><div style="text-align:right;margin-bottom:.4rem">
  <button onclick="document.getElementById('player').close()"
          style="background:none;border:none;color:#8b93a1;font-size:1rem;cursor:pointer">✕ close</button>
</div><video controls autoplay id="pv"></video>
<p class="muted" id="pcap" style="margin:.6rem 0 0"></p></dialog>

<script>
async function load() {
  const g = document.getElementById('gallery');
  try {
    const clips = await (await fetch('/api/clips')).json();
    if (!clips.length) {
      g.outerHTML = '<div class="empty">No clips yet.<br>Run <code>cf detect &lt;channel&gt;</code>'
        + ' and ask your agent to clip a stream.<br>Then refresh.</div>';
    } else {
      g.innerHTML = clips.map(c => `
        <div class="card" onclick="play('${c.src}','${esc(c.title)} · ${c.duration_sec}s · ${c.layout}')">
          <div class="poster ${c.layout === 'passthrough' ? 'wide' : ''}">
            ${c.poster ? `<img loading="lazy" src="${c.poster}" alt="">`
                       : '<span class="muted">no preview</span>'}
            <span class="badge">${c.layout === 'vertical-split' ? 'shorts' : c.layout}</span>
            <span class="dur">${Math.round(c.duration_sec)}s</span>
          </div>
          <div class="meta">
            <p class="clip-title">${esc(c.title)}</p>
            <span class="sub">${esc(c.stream_title).slice(0, 40)}</span>
          </div>
        </div>`).join('');
    }
    const st = await (await fetch('/api/status')).json();
    document.getElementById('status').innerHTML = st.map(s =>
      `<div class="status-row"><span class="pill">${s.status}</span>
       <strong>${esc(s.title)}</strong>
       <span class="muted">${s.video_id}</span></div>`).join('')
      || '<p class="muted">nothing tracked yet</p>';
  } catch (e) {
    g.innerHTML = '<div class="empty">failed to load — is the server running from the project folder?</div>';
  }
}
function play(src, caption) {
  const d = document.getElementById('player');
  document.getElementById('pv').src = src;
  document.getElementById('pcap').textContent = caption;
  d.showModal();
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
load();
</script>
</body>
</html>
