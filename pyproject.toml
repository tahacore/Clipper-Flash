[project]
name = "clipper-flash"
version = "0.1.0"
description = "Agent-native clipping toolkit: turn YouTube livestreams into Shorts with your coding agent (Claude Code / Codex)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "tahacore" }]
requires-python = ">=3.11,<3.13"
keywords = ["youtube", "clips", "shorts", "agent", "claude-code", "codex", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "feedparser>=6.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
vision = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<3",
]
upload = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
cf = "clipper_flash.cli:main"

[project.urls]
Homepage = "https://github.com/tahacore/Clipper-Flash"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_flash"]

# Ship the agent skill inside the wheel so `cf install-skill` works anywhere.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "clipper_flash/_skills"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option/Argument in defaults is the idiomatic pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
